name: Build YMDithers.aex

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build YMDithers target
        run: cmake --build build --config Release --target YMDithers --parallel

      - name: Verify YMDithers.aex
        shell: pwsh
        run: |
          $aex = Get-ChildItem -Path build -Filter 'YMDithers.aex' -Recurse -File | Select-Object -First 1
          if (-not $aex) {
            Write-Host "YMDithers.aex was not found. Built files:"
            Get-ChildItem -Path build -Recurse -File | Where-Object { $_.Extension -in '.aex','.dll','.lib','.obj','.rc' } | Select-Object FullName,Length
            Write-Error "YMDithers.aex was not produced."
            exit 1
          }
          Write-Host "Built: $($aex.FullName)"
          Get-Item $aex.FullName | Format-List FullName,Length,LastWriteTime
          dumpbin /headers /exports $aex.FullName

      - name: Upload YMDithers.aex
        uses: actions/upload-artifact@v4
        with:
          name: YMDithers.aex
          path: build/bin/Release/YMDithers.aex
          if-no-files-found: error
